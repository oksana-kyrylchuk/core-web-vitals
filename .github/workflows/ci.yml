name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, build, end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Playwright transpiles the tests without type-checking them.
      - run: npm run typecheck:tests

      # Built here rather than by Playwright's webServer, so a build failure
      # shows up as its own step. In CI the webServer only serves dist/.
      - run: npm run build

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      # GitHub sets CI=true: 2 retries, 1 worker, GitHub annotations + HTML report.
      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
